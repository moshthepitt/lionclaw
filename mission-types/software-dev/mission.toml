[mission-type]
name = "software-dev"
stop = "verified"
# The confinement image every role and oracle runs in. Must carry this
# domain's toolchain (here: the pinned Rust toolchain + agent CLIs).
image = "localhost/lionclaw-runtime-dev:v1"

# The engine-owned closing check: once work and oracles settle, a fresh
# contract-blind reviewer judges the delivered product against the objective
# (oracles prove the asserted; this catches what was never asserted).
# Declared here — not in the plan — so a planner can never omit or weaken it.
[terminal-review]
role = "gap-reviewer"

[recovery]
max-attempts = 3

[execution]
default-timeout-secs = 1800
max-task-time-secs = 3600
extension-step-secs = 600
auto-continue-candidate = false
auto-continue-proof = false

[[inputs]]
name = "cargo-home"
network = true
key-files = ["Cargo.lock"]
environment = { CARGO_HOME = "/inputs/cargo-home" }

# One planner owns repository investigation, adversarial contract review, and
# the complete proposal. Additional planning perspectives are a proportional
# team choice, not default ceremony for every software change.
[[planning.tasks]]
id = "strategist"
role = "strategist"
body = "Investigate the repository, build the objective-to-contract coverage map, adversarially review it for gaps and vacuous proof, then propose the complete contract and coherent task DAG. Under this mission type's verified bar, every assertion must bind an oracle."

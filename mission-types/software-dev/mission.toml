[mission-type]
name = "software-dev"
stop = "verified"
# The confinement image every role and oracle runs in. Must carry this
# domain's toolchain (here: the pinned Rust toolchain + agent CLIs).
image = "localhost/lionclaw-runtime-dev:v1"

# The engine-owned closing check: once work and oracles settle, a fresh
# contract-blind reviewer judges the delivered product against the objective
# (oracles prove the asserted; this catches what was never asserted).
# Declared here — not in the plan — so a planner can never omit or weaken it.
[terminal-review]
role = "gap-reviewer"

[recovery]
max-attempts = 3

[[inputs]]
name = "cargo-home"
network = true
key-files = ["Cargo.lock"]
environment = { CARGO_HOME = "/inputs/cargo-home" }

# The planning DAG: an objective becomes a proposed contract via research →
# adversarial critique → authored proposal. All read-only; the author (the
# unique sink) emits the complete proposal, which mission policy approves
# before execution.
[[planning.tasks]]
id = "strategist"
role = "strategist"
body = "Investigate the repository and draft a contract of falsifiable assertions plus a task plan for the objective. Bind assertions to oracles where a command can prove them."

[[planning.tasks]]
id = "red-team"
role = "red-team"
body = "Adversarially critique the strategist's draft: unfalsifiable assertions, vacuous oracle bindings, uncovered objective, weakenable tests."
depends_on = ["strategist"]

[[planning.tasks]]
id = "author"
role = "author"
body = "Propose the final contract and task DAG, addressing the red-team's critique. Under this mission type's 'verified' bar, every assertion must bind an oracle."
depends_on = ["strategist", "red-team"]

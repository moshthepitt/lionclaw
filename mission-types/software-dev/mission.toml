[mission-type]
name = "software-dev"
stop = "verified"
# The confinement image every role and command oracle runs in. It carries the
# supported language toolchains and agent CLIs; mission-local oracles select
# only what the target repository actually uses.
image = "localhost/lionclaw-runtime-dev:v1"

[team]
planning-assignment = "planner"
gap-review-assignment = "gap-reviewer"
requires-gap-review = true

[ceilings]
network = true
install = true
writes = true

[resource-ceilings]
tmpfs = ["/tmp:rw,size=1g"]

[recovery]
max-attempts = 3

[execution]
default-timeout-secs = 1800
max-task-time-secs = 3600
extension-step-secs = 600
effect-capacity = 4
auto-continue-candidate = false
auto-continue-proof = false

[mission-type]
name = "software-dev"
stop = "verified"
# The confinement image every role and oracle runs in. Must carry this
# domain's toolchain (here: the pinned Rust toolchain + agent CLIs).
image = "localhost/lionclaw-runtime-dev:v1"
environment = { CARGO_HOME = "/scratch/cargo", CARGO_TARGET_DIR = "/scratch/target" }

[team]
planning-assignment = "strategist"
gap-review-assignment = "gap-reviewer"
requires-gap-review = true

[ceilings]
network = true
install = true
writes = true
inputs = ["cargo-home"]

[recovery]
max-attempts = 3

[execution]
default-timeout-secs = 1800
max-task-time-secs = 3600
extension-step-secs = 600
auto-continue-candidate = false
auto-continue-proof = false

[[inputs]]
name = "cargo-home"
network = true
key-files = ["Cargo.lock"]
environment = { CARGO_HOME = "/inputs/cargo-home" }

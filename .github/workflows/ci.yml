name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: bash ./scripts/ci.sh

  external-oracle-oci:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build pinned runtime image
        run: |
          podman build \
            --tag localhost/lionclaw-runtime-dev:v1 \
            --file containers/runtime/Containerfile \
            .

      - name: Run authenticated external oracle OCI test
        run: bash ./scripts/external-oracle-oci.sh

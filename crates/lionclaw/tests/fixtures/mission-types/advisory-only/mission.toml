[mission-type]
name = "advisory-only"
stop = "reviewed"
image = "localhost/lionclaw-runtime-dev:v1"

[execution]
default-timeout-secs = 1800
max-task-time-secs = 1800
extension-step-secs = 300
auto-continue-candidate = true
auto-continue-proof = true

# The reviewed bar is defined by an independent closing review.
[terminal-review]
role = "gap-reviewer"
